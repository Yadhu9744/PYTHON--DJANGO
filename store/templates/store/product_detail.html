{% extends 'store/base.html' %}
{% load static %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
  <img src="{{ product.image_url }}" class="img-fluid rounded shadow" alt="{{ product.title }}">
</div>

    <div class="col-md-6">
      <h2 class="fw-bold mb-3">{{ product.title }}</h2>
      <p class="text-muted">{{ product.description }}</p>
      <h4 class="text-success fw-bold mb-4">₹{{ product.price }}</h4>

      <div class="d-flex gap-3">
        <a href="/products/" class="btn btn-secondary">Back to Products</a>

        {% if user.is_authenticated %}
          <a href="{% url 'add_to_cart' product.id %}" class="btn btn-dark">
            <i class="bi bi-cart-plus"></i> Add to Cart
          </a>
        {% else %}
          <a href="{% url 'login' %}" class="btn btn-outline-primary">
            <i class="bi bi-box-arrow-in-right"></i> Login to Add
          </a>
        {% endif %}
      </div>
    </div>
</div>
{% endblock %}
