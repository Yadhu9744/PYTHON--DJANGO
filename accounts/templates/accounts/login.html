{% extends 'store/base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh; background: linear-gradient(135deg, #e3f2fd, #ffffff);">
    <div class="card shadow-lg p-4 border-0" style="width: 420px; border-radius: 20px;">
        <h2 class="text-center mb-4" style="font-weight: 600; color: #0d6efd;">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </h2>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-info">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                {{ form.password }}
            </div>

            <div class="d-grid mt-3">
                <button type="submit" class="btn btn-primary btn-lg" style="border-radius: 10px;">
                    Login
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="mb-1">Don’t have an account?</p>
            <a href="{% url 'signup' %}" class="btn btn-outline-primary btn-sm" style="border-radius: 8px;">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}
